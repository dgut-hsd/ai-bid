server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：让 proxy_pass 每次请求重新解析 backend-java 的 IP。
    # 否则 backend-java 容器重建后 IP 变化，nginx 缓存旧 IP 会 502，直到重启本容器。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend-java:3000;

    # SPA 路由：非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 Java 后端（容器服务名 backend-java:3000）
    # 注意 proxy_pass 不带 URI，完整保留 /api/xxx 路径给后端
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
    }

    # SSE 流式接口：关闭缓冲，保证事件实时推送（更长的前缀优先匹配）
    location /api/chat/stream {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # pdfjs worker：只对 .mjs 单独设置 JS MIME（regex 命中优先于 /assets/，且不继承 immutable）
    # 放在 location 级避免 types 整体替换全局 mime.types，否则 .html/.js/.css 会全变成 octet-stream
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    # 构建产物静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}