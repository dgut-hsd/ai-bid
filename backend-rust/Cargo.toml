[package]
name = "ai-bid"
version = "0.1.0"
edition = "2024"
default-run = "ai-bid"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
pdfplumber = { version = "0.2", features = ["serde"] }
regex = "1"
fastembed = "5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ureq = "3"
chrono = "0.4"
async-trait = "0.1"
dotenv = "0.15"
axum = { version = "0.7", features = ["multipart", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
# Qdrant 向量库客户端（gRPC）。版本用 1.x 最新，builder API 从 1.8 起可用
qdrant-client = "1"