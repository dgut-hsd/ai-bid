spring:
  profiles:
    active: prod
  application:
    name: smart_tender
  mvc:
    async:
      request-timeout: 600000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_tender_system?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&socketTimeout=30000&connectTimeout=5000
    username: root
    password: "123456"
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 60000
      keep-alive: true
      keep-alive-between-time-millis: 60000
      min-idle: 2
      max-active: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 10
      timeout: 10000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: false
    baseline-on-migrate: true
  sql:
    init:
      mode: always
      schema-locations: classpath:audit_task_event.sql,classpath:trace_schema.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

security:
  jwt:
    # Local/test fallback only; production profile requires ST_JWT_SECRET.
    secret: ${ST_JWT_SECRET:local-test-only-jwt-secret-change-me}
    ttl-millis: ${ST_JWT_TTL_MILLIS:86400000}
    accept-legacy-user-id: false

# 文件存储配置
file:
  storage:
    path: ${ST_DATA_ROOT:D:/smart-tender/data}
    tender-dir: ${ST_UPLOAD_TENDER_DIR:tenders}
    knowledge-dir: ${ST_UPLOAD_KB_DIR:knowledge/uploads}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ithsd.smart_tender.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-parameters: false
    pretty-print: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

preview:
  cache:
    path: ${ST_PREVIEW_CACHE_DIR:D:/smart-tender/data/preview-cache}
  converter:
    base-url: http://localhost:8088

audit:
  queue:
    mode: async
    stream-key: queue:audit:tasks
    consumer-group: audit-task-workers
    consumer-name-prefix: worker
    batch-size: 5
    block-ms: 1000
    poll-delay-ms: 500
    max-retry: 3
    dlq-stream-key: queue:audit:tasks:dlq
  sse:
    replay-max-events: 100
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    keep-alive-seconds: 60
# Rust 审核引擎 HTTP API（唯一 AI 引擎）
rust:
  api:
    base-url: http://127.0.0.1:3001
    connect-timeout-ms: 5000
    read-timeout-ms: 900000
    health-check-enabled: true
