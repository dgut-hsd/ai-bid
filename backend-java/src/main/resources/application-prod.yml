# ── 生产环境配置覆盖 ──
server:
  port: 3000

security:
  jwt:
    # 生产环境必须显式注入签名密钥；缺失时启动即失败，杜绝硬编码回退密钥。
    secret: ${ST_JWT_SECRET}
    ttl-millis: ${ST_JWT_TTL_MILLIS:86400000}
    accept-legacy-user-id: false

rust:
  api:
    # 生产环境同样禁止默认内部签名密钥（与 Rust 侧一致，仅从环境变量读取）。
    internal-secret: ${RUST_API_INTERNAL_SECRET}

file:
  storage:
    path: /opt/smart-tender/data/uploads

preview:
  cache:
    path: /opt/smart-tender/data/preview-cache

rag:
  base-url: http://127.0.0.1:8000
