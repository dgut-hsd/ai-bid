# 依赖服务 Compose：MySQL + Redis + Qdrant + Neo4j
# 向量检索统一走 Qdrant；Milvus/etcd/MinIO/Attu 已彻底移除（历史遗留，与代码不符）。
services:
  # MySQL（供 Spring Boot 使用）
  mysql:
    container_name: ${ST_MYSQL_CONTAINER:-smart-mysql}
    image: ${ST_MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ST_MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${ST_MYSQL_DATABASE:-smart_tender_system}
      TZ: Asia/Shanghai
    ports:
      - "${ST_DB_PORT:-3306}:3306"
    volumes:
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/mysql:/var/lib/mysql
    networks:
      - qdrant-network

  # Redis（供 Spring Boot 使用）
  redis:
    container_name: smart-redis
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/redis:/data
    networks:
      - qdrant-network

  # 文档转换服务（JODConverter + LibreOffice）
  # 注：ghcr.io/jodconverter 镜像国内拉取困难，暂时注释；docx 转换走 Rust 侧
  # doc-converter:
  #   container_name: doc-converter
  #   image: ghcr.io/jodconverter/jodconverter-examples:rest
  #   ports:
  #     - "8088:8080"
  #   environment:
  #     SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
  #     SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
  #   networks:
  #     - qdrant-network

  # Qdrant 向量数据库（单进程，无需 etcd/MinIO）
  qdrant:
    container_name: smart-qdrant
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"   # HTTP REST + Web Dashboard
      - "6334:6334"   # gRPC（qdrant-client 走此端口）
    volumes:
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/qdrant/storage:/qdrant/storage
    networks:
      - qdrant-network

  # Neo4j 图数据库（知识图谱存储）
  neo4j:
    container_name: my-neo4j
    image: neo4j:5.21
    environment:
      NEO4J_AUTH: ${ST_NEO4J_AUTH:-neo4j/b1234567}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/neo4j/data:/data
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/neo4j/logs:/logs
      - ${ST_DATA_ROOT:-/opt/smart-tender/data}/neo4j/plugins:/plugins
    networks:
      - qdrant-network

networks:
  qdrant-network:
    name: qdrant-network
    driver: bridge